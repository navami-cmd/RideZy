<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Live trip · RideZy</title>
<link rel="icon" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--navy:#0b1f3f;--ink:#10243f;--muted:#5b7089;--blue:#3f6fa8;--sky:#e6eff7;--line:#dbe5ee;--ok:#2e7d5b;--display:'Fraunces',Georgia,serif;--body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font:16px/1.45 var(--body);color:var(--ink);background:#eaf1f7 url('images/canvas.jpg') center/cover fixed;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:.6rem;padding:.7rem 1.1rem;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.top img{height:24px}
.brand{font-family:var(--display);font-weight:900;font-size:1.35rem;color:var(--navy)}
.brand span{color:var(--blue)}
.live{margin-left:auto;font-size:.78rem;font-weight:700;padding:.25rem .7rem;border-radius:99px;background:var(--sky);color:var(--muted)}
.live.on{background:#d9f2e5;color:var(--ok)}
.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;padding:1.2rem 1.3rem;margin-bottom:12px;box-shadow:0 14px 34px -22px rgba(16,36,63,.35)}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;letter-spacing:-.01em;line-height:1.15}
.sub{color:var(--muted);margin-top:.3rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:500}
.steps{display:flex;gap:4px;margin:1rem 0 .2rem}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--navy)}
#map{height:340px;border-radius:20px;border:1px solid var(--line);margin-bottom:12px;background:#e4edf5}
.pin{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.7rem;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.foot{font-size:.8rem;color:var(--muted);text-align:center;padding:.4rem 1rem 1.2rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="images/logo.png" alt=""><div class="brand">Ride<span>Zy</span></div><span class="live" id="live">Connecting</span></header>

  <section class="card" id="main">
    <h1 id="title">Loading trip…</h1>
    <p class="sub" id="sub"></p>
    <div class="steps" id="steps"><i></i><i></i><i></i><i></i></div>
  </section>

  <div id="map"></div>

  <section class="card" id="details" hidden>
    <div class="kv"><span>From</span><span id="from"></span></div>
    <div class="kv"><span>To</span><span id="to"></span></div>
    <div class="kv" id="drow"><span>Driver</span><span id="driver"></span></div>
    <div class="kv" id="vrow"><span>Vehicle</span><span id="vehicle"></span></div>
    <div class="kv" id="erow"><span>Estimated arrival</span><span id="eta"></span></div>
    <div class="kv"><span>Last update</span><span id="upd"></span></div>
  </section>
  <p class="foot">Someone shared this trip with you so you can check they are safe. This page shows no personal details beyond the vehicle and route, and the link stops working 30 minutes after the trip ends.</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haversine=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLng=r(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const SPEED={bike:30,pool:20,auto:22,mini:24,sedan:24,suv:24,luxe:30};
const token=new URLSearchParams(location.search).get('t')||'';
const TEXT={
  searching:['Finding a driver','The rider has asked for a ride and is waiting for a driver.',0],
  accepted:['Driver is on the way to the pickup','The driver has accepted and is heading to the pickup point.',1],
  arrived:['Driver has reached the pickup','The rider is about to get in.',2],
  started:['Trip in progress','The rider is on the way to their destination.',3],
  completed:['Trip ended','The rider has reached the destination.',4],
  cancelled:['Trip cancelled','This trip was cancelled.',0],
  no_drivers:['Trip not started','No driver was available for this trip.',0]
};
let map=null,mk={},fitted=false,timer=null,lastOk=0;
const pin=(c,t)=>L.divIcon({className:'',html:`<div class="pin" style="background:${c}">${t}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
function initMap(){
  if(typeof L==='undefined'){$('#map').hidden=true;return}
  map=L.map('map',{zoomControl:true}).setView([13,80.2],10);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16,maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:16,maxZoom:19}).addTo(map);
}
function put(key,p,icon){
  if(!map)return;
  if(!p||p.lat==null){if(mk[key]){map.removeLayer(mk[key]);mk[key]=null}return}
  if(mk[key])mk[key].setLatLng([p.lat,p.lng]);else mk[key]=L.marker([p.lat,p.lng],{icon}).addTo(map);
}
function paint(t){
  const [title,sub,step]=TEXT[t.status]||['Trip','',0];
  $('#title').textContent=title;$('#sub').textContent=sub;
  document.querySelectorAll('#steps i').forEach((el,i)=>el.classList.toggle('on',i<step||(t.status==='completed'&&true)));
  $('#details').hidden=false;
  $('#from').textContent=t.pickup.name.split(',').slice(0,2).join(',');$('#to').textContent=t.drop.name.split(',').slice(0,2).join(',');
  const d=t.driver;
  $('#drow').hidden=$('#vrow').hidden=!d;
  if(d){$('#driver').textContent=d.name;$('#vehicle').textContent=`${d.model} · ${d.plate}`}
  let eta='–';
  if(d&&d.lat!=null&&['accepted','arrived','started'].includes(t.status)){
    const target=t.status==='started'?t.drop:t.pickup,km=haversine(d,target)*1.3,min=Math.max(1,Math.round(km/(SPEED[t.type]||24)*60));
    eta=t.status==='arrived'?'At pickup':`about ${min} min to ${t.status==='started'?'destination':'pickup'}`;
  }else if(t.status==='completed')eta='Arrived';
  $('#eta').textContent=eta;$('#erow').hidden=!d&&t.status!=='completed';
  put('a',t.pickup,map&&pin('#0b1f3f','A'));put('b',t.drop,map&&pin('#3f6fa8','B'));
  put('d',d&&d.lat!=null?d:null,map&&L.divIcon({className:'',html:'<div class="pin" style="background:#2e7d5b;width:30px;height:30px">D</div>',iconSize:[30,30],iconAnchor:[15,15]}));
  if(map&&!fitted){const pts=[[t.pickup.lat,t.pickup.lng],[t.drop.lat,t.drop.lng]];if(d&&d.lat!=null)pts.push([d.lat,d.lng]);map.fitBounds(pts,{padding:[40,40],maxZoom:16});fitted=true}
  else if(map&&d&&d.lat!=null&&t.status!=='completed')map.panTo([d.lat,d.lng],{animate:true});
}
async function tick(){
  try{
    const r=await fetch('/api/track/'+encodeURIComponent(token));
    const t=await r.json();
    if(!r.ok){stop(r.status===410?'This trip link has expired.':'This link is not valid.');return}
    lastOk=Date.now();paint(t);
    const live=$('#live'),final=['completed','cancelled','no_drivers'].includes(t.status);
    live.textContent=final?'Ended':'Live';live.classList.toggle('on',!final);
    if(final)clearInterval(timer);
  }catch(e){$('#live').textContent='Reconnecting';$('#live').classList.remove('on')}
  const s=lastOk?Math.round((Date.now()-lastOk)/1000):null;$('#upd').textContent=s===null?'–':(s<5?'just now':s+' seconds ago');
}
function stop(msg){clearInterval(timer);$('#title').textContent=msg;$('#sub').textContent='Ask the person who shared it for a new link.';$('#live').textContent='Closed';$('#map').hidden=true;$('#steps').hidden=true}
if(!token)stop('This link is not valid.');
else{initMap();tick();timer=setInterval(tick,3000);setInterval(()=>{if(lastOk){const s=Math.round((Date.now()-lastOk)/1000);$('#upd').textContent=s<5?'just now':s+' seconds ago'}},1000)}
</script>
</body>
</html>
